name: attendance_guard
description: WiFi-based Attendance Tracker — monitors connection time, detects delays, and enforces fines using WiFi SSID and MAC address verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  network_info_plus: ^5.0.3
  http: ^1.2.0
  intl: ^0.19.0
  crypto: ^3.0.3
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
